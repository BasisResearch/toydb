\* TLC configuration for Raft_trace.tla: follow one logged run of the shell.
\* N is the logged cluster size (the log's header says it); the bounds are
\* guards in Raft.tla (A3), so they sit above anything a test script reaches.
\* TraceLog names the log: the node tests with --features tla-trace write
\* target/tla-traces/node/<script>.ndjson. The run ends without error either
\* way: the log conforms when the depth of the search is its number of steps
\* plus one.

CONSTANTS
    N = 3
    MaxTerm = 20
    MaxLog = 50
    MaxRead = 50
    MaxMsgs = 1000
    Nil = Nil
    Command = {c1}
    TraceLog = "../target/tla-traces/node/election.ndjson"

INIT TraceInit
NEXT TraceNext
CHECK_DEADLOCK FALSE
