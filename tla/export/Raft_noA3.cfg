\* Raft.cfg without TypeOK, for the oracle with its (A3) guards deleted
\* (export/oracle.sh noa3): without the guards, a successor one step past
\* MaxTerm, MaxLog or MaxRead is evaluated before the constraint drops it, and
\* TypeOK's bounded domains do not contain it.  See EXPORT.md.

CONSTANTS
    N = 3
    MaxTerm = 2
    MaxLog = 2
    MaxRead = 1
    MaxMsgs = 7
    Nil = Nil
    Command = {c1, c2}

INIT Init
NEXT Next

CONSTRAINT Constraint

INVARIANTS
    inv_wf
    inv_hosts
    inv_msgs
    inv_lterms
    inv_ack_persist
    inv_vote_persist
    inv_commits
    inv_leader_completeness
    inv_commit_msgs
    inv_host_commits
    inv_commit_leaders
    inv_reads
