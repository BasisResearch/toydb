\* TLC configuration for Raft.tla -- the transliteration of src/raft/safety.rs.
\* Bounds chosen so the model exhausts in a few minutes on 4 workers.

CONSTANTS
    N = 3
    MaxTerm = 2
    MaxLog = 2
    MaxRead = 1
    MaxMsgs = 7
    Nil = Nil
    Command = {c1, c2}

INIT Init
NEXT Next

CONSTRAINT Constraint

\* Every inv_* conjunct of safety.rs::inv is listed separately, so a
\* violation names the conjunct rather than the conjunction.
INVARIANTS
    TypeOK
    inv_wf
    inv_hosts
    inv_msgs
    inv_lterms
    inv_ack_persist
    inv_vote_persist
    inv_commits
    inv_leader_completeness
    inv_commit_msgs
    inv_host_commits
    inv_commit_leaders
    inv_reads
