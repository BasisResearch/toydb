\* Deeper check for inv_reads's R2 clause.  Three nodes, twelve messages and
\* MaxLog = 1 (noops only, so t_propose never fires) reach a term-1 leader
\* submitting a read after term 2 committed, so R2's antecedent is satisfied
\* (Raft_deep_reads_witness.cfg shows it).  Twelve is the least budget that
\* holds the witness inside the model: at ten TLC only meets it as a
\* one-step-past-the-bound successor (t_submit_read adds two messages).  MaxLog = 1 makes leader
\* completeness vacuous again -- a leader elected after a commit needs a log
\* of length 2 -- which is what Raft_deep_lc.cfg covers.

CONSTANTS
    N = 3
    MaxTerm = 2
    MaxLog = 1
    MaxRead = 1
    MaxMsgs = 12
    Nil = Nil
    Command = {c1}

INIT Init
NEXT Next

CONSTRAINT Constraint

INVARIANTS
    TypeOK
    inv_wf
    inv_hosts
    inv_msgs
    inv_lterms
    inv_ack_persist
    inv_vote_persist
    inv_commits
    inv_leader_completeness
    inv_commit_msgs
    inv_host_commits
    inv_commit_leaders
    inv_reads
