\* Deeper check for inv_leader_completeness.  Two nodes (every quorum is both
\* nodes) and ten messages reach a second election after a commit, so the
\* conjunct's antecedent is satisfied (Raft_deep_lc_witness.cfg shows it).
\* One command: the model only compares commands for equality, and one is
\* enough to tell a client entry from a noop.

CONSTANTS
    N = 2
    MaxTerm = 2
    MaxLog = 2
    MaxRead = 1
    MaxMsgs = 10
    Nil = Nil
    Command = {c1}

INIT Init
NEXT Next

CONSTRAINT Constraint

INVARIANTS
    TypeOK
    inv_wf
    inv_hosts
    inv_msgs
    inv_lterms
    inv_ack_persist
    inv_vote_persist
    inv_commits
    inv_leader_completeness
    inv_commit_msgs
    inv_host_commits
    inv_commit_leaders
    inv_reads
