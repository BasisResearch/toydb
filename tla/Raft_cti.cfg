\* The tlc_cti probe as specified: INIT = TypeOK /\ Inv, one step, every
\* inv_* conjunct on the successor.  Not enumerable -- see Raft_cti.tla and
\* tla/README.md.  Run with -deadlock.
CONSTANTS
    N = 3
    MaxTerm = 2
    MaxLog = 2
    MaxRead = 1
    MaxMsgs = 12
    Nil = Nil
    Command = {c1, c2}

INIT CtiInit
NEXT Next
CONSTRAINT CtiOneStep

INVARIANTS
    inv_wf
    inv_hosts
    inv_msgs
    inv_lterms
    inv_ack_persist
    inv_vote_persist
    inv_commits
    inv_leader_completeness
    inv_commit_msgs
    inv_host_commits
    inv_commit_leaders
    inv_reads
