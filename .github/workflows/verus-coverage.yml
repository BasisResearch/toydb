# see LICENSE-MIT / NOTICE.
#
# Coverage of verified code. Compiles the library and the binaries through
# Verus with `--reach`, joins the reachability reports with `verus-reach`
# (scripts/verus/coverage.sh does both), and FAILS the job when
# COVERAGE_MAX_UNREACHABLE_PERCENT or more of the verified functions -- exec,
# spec and proof alike -- are unreachable from a toyDB binary's `main` or from
# a `#[verifier::reach_root]` mark. The per-file HTML report (genhtml over the
# LCOV trace) is attached to every run as a workflow artifact and linked from
# the job summary, so it works on every PR with no hosting.
#
# Pins: scripts/verus/pins.env, via the setup-verus action in Basis mode.
# verus-reach is built from the same Verus commit (reach-tool: true).

name: verus-coverage
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  # The gate: the share of verified functions that may be unreachable, i.e.
  # verified code that no binary's `main` and no `#[verifier::reach_root]` mark
  # leads to. At or above this share the job fails. Unreachable verified code is
  # code the SMT solver pays for on every run and the product never uses.
  #
  # This counts verified *exec, spec and proof* functions, because that is what
  # `verus-reach` measures -- `pct(total - reached, total)` over
  # `graph.coverage()` in tools/verus-reach. An earlier version of this comment
  # claimed the gate was exec-only. It never was, and exec-only would be the
  # wrong reading anyway: ghost code is the bulk of the verified surface here
  # (583 of 663 functions at the time of writing), so an exec-only gate would
  # hide almost everything this job exists to find. The exec-only view is a
  # separate concern, tracked by scripts/verus/verified_coverage.py.
  #
  # History: this was `COVERAGE_MIN_PERCENT: "5"`, a floor on the *reachable*
  # share -- "at least 5% reachable", which nothing could ever fail (the tree
  # was at 9% reachable on 2026-09-09, and 61% after PR #18 cut the production
  # parser over). Inverting it into a ceiling on waste makes it a ratchet
  # instead of a record of wherever we happened to land.
  #
  # Where it stands (2026-09-18): 1 of 573 verified functions unreachable, which
  # floors to 0%, so the gate passes with room. It was 91 of 663 (13%) and
  # failing; 90 of those were the `verified_lexer` token model, a ~90-function
  # spec of nothing -- never wired to the production `Lexer`, and refining an
  # executable twin that was deleted in phase 4. It was deleted rather than
  # annotated: marking it `#[verifier::reach_root]` would have satisfied this
  # gate by annotating exactly the code it exists to find. `verified_lexer` now
  # keeps only the symbol scanner `lexer.rs` actually calls.
  #
  # The one remaining unreachable function is
  # `verified_precedence::parse_expression_full`, reachable only from the
  # cfg(test) `Parser::parse_expr` (round-1 issue 7, still open).
  #
  # Ratchet, but measure before each turn of it, and read the number for what it
  # is: 51% of the verified surface (294 of 573 functions) is counted reachable
  # only because a `#[verifier::reach_root]` mark says so. Against the four
  # binaries' `main` alone the figure is 279 of 573. That is not in itself a
  # finding -- `reach_root` exists for theorems about reachable code that nothing
  # calls, which is a real category -- but it does mean this gate cannot be read
  # as "no verified code is dead" without checking what the marks carry.
  #
  # 245 of those 294 are the minparen cluster, held up by 11 marks. Before
  # trimming any of them, note what the three `*_live` marks actually are:
  # `min_roundtrip_live`, `min_normalize_live` and `stmt_min_roundtrip_live` are
  # exec functions whose *postconditions* are the round-trip theorem stated over
  # the executable production parsers -- `parse_expression_at` and
  # `parse_control_at`, the latter being exactly what `Parser::parse` calls. The
  # `proof fn` twins (`min_roundtrip`, `stmt_min_roundtrip`) are stated over the
  # spec models `sparse_prec` / `sparse_control` instead, so they do NOT subsume
  # them. Dropping the three marks would read as a 10% improvement in waste while
  # actually dropping the only proofs that bind the round trip to running code.
  COVERAGE_MAX_UNREACHABLE_PERCENT: "5"
  OUT_DIR: ".verus-out/coverage"

jobs:
  verus-coverage:
    name: Verus coverage (reachable verified code)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Basis Verus + verus-reach (scripts/verus/pins.env)
        id: verus
        uses: ./.github/actions/setup-verus
        with:
          distribution: "basis"
          reach-tool: "true"

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: verus-coverage-${{ runner.os }}-${{ steps.verus.outputs.verus_tag }}-${{ hashFiles('Cargo.lock') }}

      - name: Install lcov (genhtml)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov
          genhtml --version

      - name: Reachability reports, summary, LCOV, HTML
        run: scripts/verus/coverage.sh --out "$OUT_DIR"

      - name: Upload HTML report
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: verus-coverage-html
          path: ${{ env.OUT_DIR }}/html
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo '## Coverage of verified code'
            echo ''
            echo ":bar_chart: [Download the HTML report (verus-coverage-html artifact)](${{ steps.upload.outputs.artifact-url }}) and open \`index.html\`."
            echo ''
            echo "Gate: fewer than ${COVERAGE_MAX_UNREACHABLE_PERCENT}% of verified functions (exec, spec and proof) may be unreachable from a binary or a reach_root mark."
            echo "Verus ${{ steps.verus.outputs.verus_version }} (${{ steps.verus.outputs.verus_tag }})."
            echo ''
            echo '```'
            cat "$OUT_DIR/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce COVERAGE_MAX_UNREACHABLE_PERCENT
        # `--fail-over T` fails when the unreachable share is *strictly* greater
        # than T, and that share is floored to a whole percent. So the ceiling
        # we want -- fail at COVERAGE_MAX_UNREACHABLE_PERCENT and above -- is
        # `--fail-over` one below it: at 5, `--fail-over 4` passes 4% and fails
        # 5%.
        #
        # 0 is the end state of the ratchet and has to be clamped, not
        # decremented: `--fail-over` takes a u64, so -1 would die on clap's
        # argument parse rather than report a coverage verdict. `--fail-over 0`
        # is the strictest the tool can express -- it fails as soon as a whole
        # percent of the verified surface is unreachable.
        run: |
          threshold="$COVERAGE_MAX_UNREACHABLE_PERCENT"
          if [ "$threshold" -gt 0 ]; then threshold=$((threshold - 1)); fi
          verus-reach --fail-over "$threshold" "$OUT_DIR/reach" > /dev/null
