# see LICENSE-MIT / NOTICE.
#
# Coverage of verified code. Compiles the library and the binaries through
# Verus with `--reach`, joins the reachability reports with `verus-reach`
# (scripts/verus/coverage.sh does both), and FAILS the job when fewer than
# COVERAGE_MIN_PERCENT of the verified exec functions are reachable from a
# toyDB binary's `main`. The per-file HTML report (genhtml over the LCOV trace)
# is attached to every run as a workflow artifact and linked from the job
# summary, so it works on every PR with no hosting.
#
# Pins: scripts/verus/pins.env, via the setup-verus action in Basis mode.
# verus-reach is built from the same Verus commit (reach-tool: true).

name: verus-coverage
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  # The gate. Percent of verified exec functions that must be reachable from
  # a binary.
  #
  # History: 5 was set while the verified SQL parser was not yet wired into the
  # product (9% reachable on 2026-09-09). PR #18 cut the production parser over
  # (61% reachable), and the parser-coverage cleanup then deleted the dead
  # scaffolding the remaining 38% consisted of -- the superseded mirror printer
  # and parser, the test-only fully parenthesized printer and its spec domain,
  # the unwired lexer token model, and three template modules.
  #
  # TODO: raise this, but measure first -- do not assume ~99%. A review measured
  # 662/664 (99%) on the cleanup branch, but that figure was inflated by two
  # `#[verifier::reach_root]` marks on `verified_lexer`'s round-trip theorems,
  # which pulled roughly 100 ghost functions of an explicitly-unwired lexer model
  # into the reachable set. Those marks have been removed (see the KNOWN DEBT
  # note in verified_lexer.rs), so the real number is materially lower and the
  # unwired model is once again counted as unreached, which is correct.
  #
  # Read the figure off this job's summary and set the gate just under it, so it
  # starts catching regressions instead of tracking scaffolding. Note the gate
  # counts verified *exec* functions reachable from a binary `main`; ghost
  # spec/proof code is a separate concern, tracked by
  # scripts/verus/verified_coverage.py, which never flags ghost items.
  COVERAGE_MIN_PERCENT: "5"
  OUT_DIR: ".verus-out/coverage"

jobs:
  verus-coverage:
    name: Verus coverage (reachable verified code)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Basis Verus + verus-reach (scripts/verus/pins.env)
        id: verus
        uses: ./.github/actions/setup-verus
        with:
          distribution: "basis"
          reach-tool: "true"

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: verus-coverage-${{ runner.os }}-${{ steps.verus.outputs.verus_tag }}-${{ hashFiles('Cargo.lock') }}

      - name: Install lcov (genhtml)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov
          genhtml --version

      - name: Reachability reports, summary, LCOV, HTML
        run: scripts/verus/coverage.sh --out "$OUT_DIR"

      - name: Upload HTML report
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: verus-coverage-html
          path: ${{ env.OUT_DIR }}/html
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo '## Coverage of verified code'
            echo ''
            echo ":bar_chart: [Download the HTML report (verus-coverage-html artifact)](${{ steps.upload.outputs.artifact-url }}) and open \`index.html\`."
            echo ''
            echo "Gate: at least ${COVERAGE_MIN_PERCENT}% of verified exec functions reachable from a binary."
            echo "Verus ${{ steps.verus.outputs.verus_version }} (${{ steps.verus.outputs.verus_tag }})."
            echo ''
            echo '```'
            cat "$OUT_DIR/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce COVERAGE_MIN_PERCENT
        run: verus-reach --fail-under "$COVERAGE_MIN_PERCENT" "$OUT_DIR/reach" > /dev/null
