#
# Verus verification GATE. Runs `scripts/verus/verify.sh` (i.e. `cargo verus
# focus --lib` over the opted-in modules) and FAILS the PR if any verified
# module stops verifying with upstream Z3. The Basis fork runs separately in
# verus-verify.yml and verus-coverage.yml for statistics.
#
# Pins: scripts/verus/pins.env, installed by the setup-verus action in upstream
# mode.

name: verus-gate
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verus-gate:
    name: Upstream Verus gate (z3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Test toolchain setup and failure reporting
        run: python3 scripts/verus/test_setup.py

      - name: Install pinned upstream Verus and solver
        id: verus
        uses: ./.github/actions/setup-verus
        with:
          distribution: "upstream"
          solver: "z3"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
          key: verus-gate-upstream-${{ runner.os }}-z3-${{ steps.verus.outputs.verus_tag }}-${{ hashFiles('Cargo.lock') }}

      - name: Verify opted-in modules (gating)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/upstream-verus-z3
        run: |
          # Capture the --output-json func-details for the coverage join below;
          # stdout is pure JSON (verify.sh sends its banner to stderr).
          ulimit -u 65535 || echo "could not raise ulimit -u (soft cap)"
          ./scripts/verus/verify.sh --output-json > "$RUNNER_TEMP/verus.json"

      # --- verified-coverage gate ---------------------------------------------
      # Flags any verified EXEC function that the lib test suite never executes
      # (dynamic lens: cargo-llvm-cov joined against the func-details above). A
      # committed allowlist (scripts/verus/verified_coverage_allow.txt) carries
      # the currently-known dead twins, retired in phase 4; anything NEW that is
      # verified but never run fails the PR. The static (call-graph) lens is
      # advisory only until a real Verus call graph is wired, so --check uses the
      # precise dynamic lens and does NOT pass --graph here.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure lib-test coverage
        run: |
          cargo llvm-cov test --lib --json \
            --output-path "$RUNNER_TEMP/llvm-cov.json"

      - name: Gate on verified-but-unexecuted functions
        run: |
          python3 scripts/verus/verified_coverage.py --check \
            --verus-json "$RUNNER_TEMP/verus.json" \
            --llvm-cov "$RUNNER_TEMP/llvm-cov.json"
