#
# Verus verification GATE. Runs `scripts/verus/verify.sh` (i.e. `cargo verus
# focus --lib` over the opted-in modules) and FAILS the PR if any verified
# module stops verifying. This is the enforcement counterpart to the
# non-blocking telemetry workflow in verus-verify.yml: that one measures
# progress and never fails; this one holds the line on what is already proven.
#
# Pins: scripts/verus/pins.env, via the setup-verus action (shared with
# verus-verify.yml and verus-coverage.yml).

name: verus-gate
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verus-gate:
    name: Verus gate (verify opted-in modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Basis Verus (scripts/verus/pins.env)
        id: verus
        uses: ./.github/actions/setup-verus

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: verus-gate-${{ runner.os }}-${{ steps.verus.outputs.verus_tag }}-${{ hashFiles('Cargo.lock') }}

      - name: Verify opted-in modules (gating)
        run: |
          # Verus spawns many Z3 processes; give the runner process headroom.
          ulimit -u 65535 || echo "could not raise ulimit -u (soft cap)"
          ./scripts/verus/verify.sh
