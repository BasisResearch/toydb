name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@1.97.1
      id: toolchain
      with:
        components: clippy, rustfmt
    - uses: actions/cache@v6
      with:
        path: target
        key: ${{runner.os}}-target-${{steps.toolchain.outputs.cachekey}}-${{hashFiles('Cargo.lock')}}
    - run: cargo build --bins --tests
    - run: cargo test
    - run: cargo clippy --tests --no-deps -- -D warnings
    - run: cargo fmt --check
    - run: cargo doc --no-deps 
      env:
        RUSTDOCFLAGS: -D warnings
    # The tla-trace feature (trace validation, see tla/README.md): the shell's
    # step logging compiles, lints and passes the tests with it on, and the
    # tla-trace crate (not a workspace member) runs its own tests.
    - run: cargo clippy --tests --no-deps --features tla-trace -- -D warnings
    - run: cargo test --features tla-trace
    - run: python3 -m unittest discover -s tla-trace -p 'test_*.py'
    - run: cargo fmt --check --manifest-path tla-trace/macros/Cargo.toml
    - run: cargo clippy --manifest-path tla-trace/macros/Cargo.toml --target-dir target/tla-trace -- -D warnings
    - run: cargo fmt --check --manifest-path tla-trace/Cargo.toml
    - run: cargo clippy --manifest-path tla-trace/Cargo.toml --target-dir target/tla-trace --tests -- -D warnings
    - run: cargo test --manifest-path tla-trace/Cargo.toml --target-dir target/tla-trace

  trace:
    name: Trace validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The BasisResearch/tlaplus fork's jar (it has the Json module), the
      # build verus-tools-mcp pins.
      TLC_TAG: basis-11305b4a05
      TLC_SHA256: 46f5b2249f4832bc2927ea24e0ab8ef3791530270e90200314e05c2e67d191a8

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@1.97.1
      id: toolchain
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/cache@v6
      with:
        path: target
        key: ${{runner.os}}-trace-${{steps.toolchain.outputs.cachekey}}-${{hashFiles('Cargo.lock')}}
    - name: Download the pinned tla2tools.jar
      run: |
        curl -sSfL --retry 5 -o "$RUNNER_TEMP/tla2tools.jar" \
          "https://github.com/BasisResearch/tlaplus/releases/download/$TLC_TAG/tla2tools.jar"
        echo "$TLC_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
        echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
    # Every node goldenscript's step log conforms to tla/Raft.tla (conform.sh
    # with no arguments runs the tests and checks each log), and the known-bad
    # fixtures diverge at the step their header names.
    - run: tla/conform.sh
    - run: tla/conform.sh tla/traces/*.ndjson
