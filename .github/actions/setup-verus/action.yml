#
# Install the Basis Verus toolchain pinned in scripts/verus/pins.env: verus +
# cargo-verus from the basis-build release of the pinned commit, the Rust
# toolchain and z3 that release names, and (optionally) verus-reach built from
# the same commit. Every Verus workflow uses this, so all of them run the same
# versions and record the same version strings. The work is in
# scripts/verus/setup-verus.sh; this wrapper adds the verus-reach cache.

name: setup-verus
description: Install the Basis Verus toolchain pinned in scripts/verus/pins.env

inputs:
  reach-tool:
    description: Also build verus-reach (tools/verus-reach) from the same commit
    default: "false"

outputs:
  verus_tag:
    description: basis-build release tag installed (basis-<10-char sha>)
    value: ${{ steps.resolve.outputs.verus_tag }}
  verus_commit:
    description: BasisResearch/verus commit the installed binaries were built from
    value: ${{ steps.install.outputs.verus_commit }}
  verus_version:
    description: Verus version string (as `verus --version`)
    value: ${{ steps.install.outputs.verus_version }}
  rust_toolchain:
    description: Rust toolchain the release was built with (installed + RUSTUP_TOOLCHAIN)
    value: ${{ steps.install.outputs.rust_toolchain }}
  vstd_version:
    description: vstd version shipped by the release (Cargo.toml should pin this)
    value: ${{ steps.install.outputs.vstd_version }}
  mcp_commit:
    description: BasisResearch/verus-tools-mcp commit resolved from VERUS_MCP_REF
    value: ${{ steps.resolve.outputs.mcp_commit }}
  mcp_version:
    description: MCP server version string as the server reports it (<semver>+g<sha7>)
    value: ${{ steps.resolve.outputs.mcp_version }}

runs:
  using: composite
  steps:
    - name: Resolve scripts/verus/pins.env
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/verus/setup-verus.sh resolve

    - name: Cache verus-reach
      if: inputs.reach-tool == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.verus-ci/reach
        key: verus-reach-${{ runner.os }}-${{ steps.resolve.outputs.verus_tag }}

    - name: Install Verus, Rust toolchain, z3
      id: install
      shell: bash
      run: scripts/verus/setup-verus.sh install ${{ inputs.reach-tool == 'true' && '--reach' || '' }}
