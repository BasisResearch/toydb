[package]
name = "toydb"
version = "1.0.0"
description = "A simple distributed SQL database, built for education"
authors = ["Erik Grinaker <erik@grinaker.me>"]
license = "Apache-2.0"
homepage = "https://github.com/erikgrinaker/toydb"
repository = "https://github.com/erikgrinaker/toydb"
edition = "2024"
default-run = "toydb"
publish = false

[lib]
doctest = false

# `verus_keep_ghost` is set by cargo-verus/Verus when it keeps ghost (spec/proof)
# code; a plain `cargo build` never sets it. Verified modules gate ghost-only
# `use` imports behind it, so register the cfg here to keep `cargo build`/`clippy`
# from warning about an "unexpected cfg condition name".
[lints.rust]
# `verus_reach` is set only by the reachability tooling (scripts/verus/coverage.sh
# and the verus-coverage job), which builds with the BasisResearch Verus fork. It
# gates the `#[verifier::reach_root]` marks: `reach_root` is a fork-only
# attribute, and the upstream Verus release the gating verus-gate job installs
# rejects it outright ("unrecognized verifier attribute"), so an unconditional
# mark makes that job fail to COMPILE before it checks a single proof. Writing the
# marks as `#[cfg_attr(verus_reach, verifier::reach_root)]` keeps them for the
# fork's reachability runs and makes them invisible to everyone else.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_keep_ghost)',
  'cfg(verus_reach)',
] }

# Verus progressive verification. `cargo verus focus --lib` verifies the modules
# opted in via `verus!` blocks; everything else is external-by-default and
# untouched. `scripts/verus/verify.sh` and the verus-gate CI job drive it. A
# normal `cargo build` ignores this table and erases all spec/proof code.
[package.metadata.verus]
verify = true

[dependencies]
# vstd is Verus's verified std. Published on crates.io; it compiles under a
# normal `cargo build` (the `verus!` macro erases ghost code), so keeping it a
# plain dependency lets verified code live inline in real modules. Pin tracks
# the vstd version shipped by the upstream proof gate (scripts/verus/pins.env).
# Upstream setup rejects version drift; the Basis statistics setup warns.
vstd = "=0.0.0-2026-08-30-0159"
bincode = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["cargo", "derive"] }
config = "0.15"
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }
dyn-clone = "1.0"
hdrhistogram = "7.5"
itertools = "0.15"
log = "0.4"
petname = "3.0.0"
rand = "0.10"
regex = "1.12"
rustyline = "18.0"
rustyline-derive = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
simplelog = "0.12"
uuid = { version = "1.21", features = ["serde", "v4"] }

[dev-dependencies]
escargot = "0.5"
goldenscript = "0.8"
hex = "0.4"
paste = "1.0"
proptest = "1.7"
serde_json = "1.0"
tempfile = "3.25"
test-case = "3.3"
test_each_file = "0.3"
