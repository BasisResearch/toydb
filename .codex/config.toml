# Verus telemetry (Component 2) — Codex project-scoped configuration.
#
# Codex (>= 0.150) loads this file as a project config layer when the project
# is trusted (~/.codex/config.toml: projects."<clone-path>".trust_level =
# "trusted"). No user-level merge is needed; a fresh trusted clone is wired.
#
# Hooks from this file require a one-time trust review (/hooks in the CLI), or
# launching with --dangerously-bypass-hook-trust.

# --- Verus MCP server (gating: makes the server present by default) ----------
# Codex exposes no pre-run event, so it cannot hard-gate before running. Making
# the server present here means the tools are available; the Stop hook records
# gate_violation=true if they were not, so ungated runs are visible on the
# dashboard rather than silently counted.
[mcp_servers.verus]
command = "verus-tools-mcp"
args = ["stdio"]

[mcp_servers.verus.tools.version]
approval_mode = "approve"

[mcp_servers.verus.tools.verify]
approval_mode = "approve"

# --- Stop hook (capture) ------------------------------------------------------
# Fail-soft session-trace capture at every turn end. The command resolves the
# clone's git root (hook commands run with the session cwd as their working
# directory), so it works in any clone without editing this file.
# VERUS_INGEST_TOKEN must be in the hook's environment for a live upload; set
# VERUS_INGEST_DRY_RUN=1 to test.
#
# Branch discipline (see AGENTS.md): Codex has no pre-tool event, so its
# enforcement is the committed git hooks (.githooks/ pre-commit + pre-push).
# The Stop hook self-provisions `core.hooksPath .githooks` in the clone; to
# activate them before the first session ends, run once:
#     git config core.hooksPath .githooks
# Failed attempts: Codex reads AGENTS.md, which tells it to run
#     python3 .claude/hooks/mark_branch.py failed --category <tag> --agent codex "<reason>"
# when the user declares a branch a failed attempt. VERUS_INGEST_TOKEN must be
# in Codex's environment for the upload (same token as the Stop hook).
[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/verus_stop.py"'
timeout = 60
statusMessage = "Uploading Verus session trace"
