# Verus telemetry (Component 2) — Codex configuration fragment.
#
# Codex config is USER-LEVEL (~/.codex/config.toml), not per-repo, so Codex will
# not read this file from the toyDB checkout automatically. Merge the blocks
# below into your ~/.codex/config.toml once per machine. The Stop hook SCRIPT is
# committed in the repo at .codex/hooks/verus_stop.py so a fresh clone carries
# the capture logic; only this config wiring is a one-time user merge.
#
# On first run Codex trust-reviews the hook command.

# --- Verus MCP server (gating: makes the server present by default) ----------
# Codex exposes no pre-run event, so it cannot hard-gate before running. Making
# the server present here means the tools are available; the Stop hook records
# gate_violation=true if they were not, so ungated runs are visible on the
# dashboard rather than silently counted.
[mcp_servers.verus]
command = "verus-tools-mcp"
args = ["stdio"]

# --- Stop hook (capture) ------------------------------------------------------
# Point the command at the committed script inside your toyDB checkout. Replace
# /ABSOLUTE/PATH/TO/toydb with your clone location. VERUS_INGEST_TOKEN must be in
# the hook's environment for a live upload; set VERUS_INGEST_DRY_RUN=1 to test.
#
# Branch discipline (see AGENTS.md): Codex has no pre-tool event, so its
# enforcement is the committed git hooks (.githooks/ pre-commit + pre-push).
# The Stop hook self-provisions `core.hooksPath .githooks` in the clone; to
# activate them before the first session ends, run once:
#     git config core.hooksPath .githooks
[[hooks.Stop]]
command = ["python3", "/ABSOLUTE/PATH/TO/toydb/.codex/hooks/verus_stop.py"]
